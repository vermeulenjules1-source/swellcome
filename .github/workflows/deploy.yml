# Met le site en ligne sur GitHub Pages à chaque push sur main,
# et récupère les prévisions Open-Meteo quatre fois par jour.
# Étapes : récupérer le code, collecter (sauf sur un push), lancer scripts/build.py, publier dist/.
name: Mise en ligne du site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3,9,15,21 * * *'  # heures UTC, à une minute peu chargée
  workflow_dispatch:  # permet aussi de lancer la mise en ligne à la main depuis l'onglet Actions

permissions:
  contents: write  # pour enregistrer les prévisions dans data/forecast/
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; la plus récente l'emporte
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collecter les prévisions
        if: github.event_name != 'push'
        run: python3 scripts/collecte.py

      - name: Enregistrer les prévisions si elles ont changé
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast
          if ! git diff --cached --quiet; then
            git commit -m "Prévisions : mise à jour automatique"
            git pull --rebase origin main
            git push
          fi

      - name: Construire le site
        # Sans nom de domaine, GitHub Pages sert le site sous /swellcome
        env:
          SWELLCOME_BASE: /swellcome
        run: python3 scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
